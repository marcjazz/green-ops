server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # API routes (need to keep trailing slash in location for proper rewrite)
    location /api/alerts/ {
        rewrite ^/api/alerts/(.*) /$1 break;
        proxy_pass http://alerts-service:3001;
    }

    location /api/user/ {
        rewrite ^/api/user/(.*) /$1 break;
        proxy_pass http://user-service:3003;
    }

    # Infrastructure services
    # Ensure trailing slash is consistent
    location /keycloak/ {
        proxy_pass http://keycloak:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /prometheus/ {
        proxy_pass http://prometheus:9090/;
    }

    # Important: Ensure trailing slash for proxy_pass to strip /grafana/
    location /grafana/ {
        proxy_pass http://grafana:3000/;
    }
}
