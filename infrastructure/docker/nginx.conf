# Frontend and API (HTTPS)
server {
    listen 80;
    server_name greenops.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name greenops.local;

    ssl_certificate /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        # Allow framing from Keycloak for OIDC session checks
        add_header Content-Security-Policy "frame-ancestors 'self' https://accounts.greenops.local;";
    }

    location /api/alerts {
        rewrite ^/api/alerts/?(.*) /alerts/$1 break;
        proxy_pass http://alerts-service:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/user {
        rewrite ^/api/user/?(.*) /profile/$1 break;
        proxy_pass http://user-service:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Keycloak (HTTPS)
server {
    listen 80;
    server_name accounts.greenops.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name accounts.greenops.local;

    ssl_certificate /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;

    location / {
        proxy_pass http://keycloak:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Grafana (HTTPS)
server {
    listen 80;
    server_name monitor.greenops.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name monitor.greenops.local;

    ssl_certificate /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;

    location / {
        proxy_pass http://grafana:3000/;
        
        # WebSocket support for Grafana Live
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
