global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "alerts-service"
    static_configs:
      - targets: ["alerts-service:3001"]

  - job_name: "user-service"
    static_configs:
      - targets: ["user-service:3003"]
