services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: greenops
      POSTGRES_PASSWORD: greenops_password
      POSTGRES_DB: greenops_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: postgresql://greenops:greenops_password@postgres:5432/greenops_db?sslmode=disable
    depends_on:
      - postgres

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: accounts.greenops.local
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_RELATIVE_PATH: /
      KC_PROXY: edge
      KC_METRICS_ENABLED: "true"
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json
      - ./theme/greenops:/opt/keycloak/themes/greenops

  alerts-service:
    build:
      context: ../../
      dockerfile: apps/alerts-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://greenops:greenops_password@postgres:5432/greenops_db?schema=alerts
      PORT: 3001
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/greenops/protocol/openid-connect/certs
      PROMETHEUS_URL: http://prometheus:9090
      REDIS_URL: redis://:greenops_redis_pass@redis:6379
    depends_on:
      - postgres
      - prometheus
      - redis

  user-service:
    build:
      context: ../../
      dockerfile: apps/user-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://greenops:greenops_password@postgres:5432/greenops_db?schema=users
      PORT: 3003
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/greenops/protocol/openid-connect/certs
      REDIS_URL: redis://:greenops_redis_pass@redis:6379
    depends_on:
      - postgres
      - redis

  nginx:
    build:
      context: ../../
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - alerts-service
      - user-service

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    command:
      - "--nginx.scrape-uri=http://nginx:8081/stub_status"
    restart: unless-stopped
    depends_on:
      - nginx

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass greenops_redis_pass
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "greenops_redis_pass", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  grafana:
    image: grafana/grafana
    extra_hosts:
      - "accounts.greenops.local:host-gateway"
      - "exporter.greenops.local:host-gateway"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "greenops-grafana"
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "super-secret-grafana-key"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://accounts.greenops.local/realms/greenops/protocol/openid-connect/auth"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://accounts.greenops.local/realms/greenops/protocol/openid-connect/token"
      GF_AUTH_GENERIC_OAUTH_API_URL: "https://accounts.greenops.local/realms/greenops/protocol/openid-connect/userinfo"
      GF_AUTH_GENERIC_OAUTH_ALLOWED_DOMAINS: "greenops.local accounts.greenops.local monitor.greenops.local"
      GF_AUTH_GENERIC_OAUTH_REDIRECT_URI: "https://monitor.greenops.local/login/generic_oauth"
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
      GF_AUTH_GENERIC_OAUTH_SKIP_VERIFY_SSL: "true"
      GF_AUTH_GENERIC_OAUTH_TLS_SKIP_VERIFY_INSECURE: true
      GF_SERVER_ROOT_URL: "https://monitor.greenops.local/"
      GF_LOG_LEVEL: "debug"
    volumes:
      - ../grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
