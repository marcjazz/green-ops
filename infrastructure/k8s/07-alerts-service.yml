apiVersion: apps/v1
kind: Deployment
metadata:
  name: alerts-service
  namespace: greenops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alerts-service
  template:
    metadata:
      labels:
        app: alerts-service
    spec:
      containers:
        - name: alerts-service
          image: ghcr.io/marcjazz/green-ops/alerts-service:latest
          env:
            - name: DATABASE_URL
              value: "postgresql://greenops:greenops_password@postgres:5432/greenops_db?schema=alerts"
            - name: PORT
              value: "3001"
            - name: KEYCLOAK_JWKS_URI
              value: "http://keycloak:8080/realms/greenops/protocol/openid-connect/certs"
            - name: PROMETHEUS_URL
              value: "http://prometheus:9090"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: greenops-secrets
                  key: redis-password
          ports:
            - containerPort: 3001
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: alerts-service
  namespace: greenops
spec:
  selector:
    app: alerts-service
  ports:
    - port: 3001
      targetPort: 3001
